<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angry Birds: Traitor in the Nest</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{background:#0f172a;color:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 60%)}
  #stage{transition:opacity .35s ease,transform .35s ease}
  #stage.out{opacity:0;transform:translateY(14px)}
  .fade-in{animation:fadeIn .6s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rpg{background:#1e293b;border:2px solid #475569;border-radius:14px;box-shadow:0 0 0 3px #0f172a,0 8px 24px rgba(0,0,0,.45)}
  .choice{display:block;width:100%;text-align:left;margin-top:6px;padding:9px 12px;border-radius:10px;background:#0f172a;border:1px solid #475569;color:#f1f5f9;font-size:.92rem;transition:background .15s,border-color .15s,transform .1s;cursor:pointer}
  .choice:hover:not(:disabled){background:#7f1d1d;border-color:#ef4444}
  .choice:active{transform:scale(.98)}
  .choice:disabled{opacity:.4;cursor:not-allowed}
  .btn{padding:10px 18px;border-radius:12px;font-weight:700;color:#fff;background:#dc2626;border:2px solid #fca5a5;cursor:pointer;transition:transform .1s,background .15s}
  .btn:hover{background:#b91c1c}.btn:active{transform:scale(.97)}
  .btn.green{background:#059669;border-color:#6ee7b7}.btn.green:hover{background:#047857}
  .btn.amber{background:#d97706;border-color:#fcd34d}.btn.amber:hover{background:#b45309}
  .pip{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #f59e0b;background:transparent;margin-right:3px;transition:background .3s}
  .pip.on{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
  .bar{height:8px;border-radius:6px;background:#0f172a;overflow:hidden;border:1px solid #475569}
  .bar i{display:block;height:100%;transition:width .6s ease,background .6s}
  .hot{cursor:pointer;outline:none}
  .hot .ring{opacity:0;transition:opacity .2s}
  .hot:hover .ring,.hot:focus .ring{opacity:1}
  .hot .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .hot.done .pulse{display:none}
  .hot.done .body{opacity:.55}
  .hot .check{display:none}.hot.done .check{display:block}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:.95;transform:scale(1.05)}}
  .av{overflow:visible;display:block}
  .av-wrap{transition:transform .3s,filter .3s;opacity:.85}
  .av-wrap.speaking{transform:scale(1.18) translateY(-6px);filter:drop-shadow(0 0 8px #fbbf24);opacity:1}
  .shake{animation:shake .38s linear infinite}
  .tremble{animation:tremble .9s linear infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(5px) rotate(2deg)}}
  @keyframes tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
  .flick{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes flick{from{opacity:.7;transform:scale(.85)}to{opacity:1;transform:scale(1.15)}}
  .glint{animation:glint 2s ease-in-out infinite}
  @keyframes glint{0%,100%{opacity:.2}50%{opacity:1}}
  .card{background:#1e293b;border:2px solid #475569;border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;color:inherit}
  .card:hover:not(:disabled){transform:translateY(-3px);border-color:#f59e0b;box-shadow:0 6px 18px rgba(245,158,11,.25)}
  .card:disabled{opacity:.4;cursor:not-allowed}
  .card.picked{border-color:#10b981}
  .proj{position:absolute;left:50%;bottom:38%;transform:translate(-50%,0);transition:transform .8s ease}
  .proj.pull{transform:translate(calc(-50% - 46px),20px) rotate(-12deg)}
  .proj.fly{transition:transform 1.8s cubic-bezier(.2,.65,.35,1),opacity 1.8s;transform:translate(calc(-50% + 95vw),-80vh) rotate(1080deg) scale(.2);opacity:.2}
  #drawer{width:17rem;flex-shrink:0}
  #scrim{display:none}
  @media (max-width:767px){
    #drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;transform:translateX(105%);transition:transform .3s ease;overflow-y:auto;border-radius:14px 0 0 14px}
    #drawer.open{transform:none}
    #scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
  }
  #toast{position:fixed;top:68px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50;background:#065f46;border:2px solid #6ee7b7;padding:8px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.warn{background:#7f1d1d;border-color:#fca5a5}
  .badge-bump{animation:bump .5s}
  @keyframes bump{50%{transform:scale(1.5)}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="scrim"></div>
<div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col">
  <header class="flex items-center justify-between gap-2 px-3 py-2 border-b border-slate-700 bg-slate-900/80 sticky top-0 z-20 backdrop-blur">
    <div class="min-w-0">
      <div class="text-sm sm:text-base font-extrabold text-red-500 truncate">Angry Birds: Traitor in the Nest</div>
      <div id="phase" class="text-xs text-amber-500 uppercase tracking-widest truncate"></div>
    </div>
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <div class="text-xs sm:text-sm text-amber-400 flex items-center" title="Energi"><span class="mr-1 hidden sm:inline">Energi</span><span id="energy" class="flex items-center"></span></div>
      <button id="mute" class="px-2 py-1 rounded-lg border border-slate-600 bg-slate-800 text-sm" aria-label="Suara">🔊</button>
      <button id="invbtn" class="md:hidden px-3 py-1 rounded-lg border border-amber-500 bg-slate-800 text-sm text-amber-400">Bukti <span id="invcount" class="inline-block font-bold">0</span></button>
    </div>
  </header>
  <div class="flex flex-1 gap-3 p-3 min-h-0">
    <main class="flex-1 min-w-0 flex flex-col">
      <div id="stage" class="flex-1 pb-3"></div>
      <div id="dialog" class="rpg p-3 sticky bottom-2 z-10 flex gap-3 items-start cursor-pointer select-none">
        <div id="portrait" class="shrink-0 w-14 sm:w-16"></div>
        <div class="flex-1 min-w-0">
          <div id="speaker" class="font-extrabold text-sm tracking-wide"></div>
          <p id="dtext" class="text-sm sm:text-base leading-relaxed min-h-[3.2rem]"></p>
          <div id="choices"></div>
        </div>
        <span id="more" class="hidden text-amber-400 animate-pulse">▼</span>
      </div>
    </main>
    <aside id="drawer" class="rpg p-3 self-start md:sticky md:top-16">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-extrabold text-amber-400">🔎 Inventori Bukti</h2>
        <button id="invclose" class="md:hidden px-2 rounded border border-slate-600">✕</button>
      </div>
      <div id="inv" class="space-y-2"></div>
    </aside>
  </div>
</div>

<script>
"use strict";
/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const r = a.slice(); for(let i = r.length - 1; i > 0; i--){ const j = rnd(i + 1); const t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
const val = (x, ...args) => typeof x === 'function' ? x(...args) : x;
const SUSPECTS = ['chuck', 'bomb', 'matilda'];
const NAME = { chuck:'Chuck', bomb:'Bomb', matilda:'Matilda', red:'Red', pig:'Minion Pig' };
const firstSentence = t => (t.match(/^[^.!?]*[.!?]/) || [t])[0];
const pickBy = (obj, X, c) => typeof obj === 'function' ? obj(X, c) : obj[X];

/* ===================== STATE ===================== */
const MAX_ENERGY = 4;
const fresh = () => ({
  phase: 'intro',

/* ===================== AUDIO ENGINE ===================== */
let ac = null;
function actx(){
  if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type, vol, delay, endFreq){
  if(ui.muted) return;
  const a = actx(); if(!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .1, t + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  click(){ tone(740, .07, 'square', .05); },
  chime(){ [523.25, 659.25, 783.99].forEach((f, i) => tone(f, .9, 'sine', .12, i * .07)); tone(1046.5, 1, 'triangle', .08, .22); },
  buzz(){
    if(ui.muted) return; const a = actx(); if(!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain(), l = a.createOscillator(), lg = a.createGain();
    o.type = 'sawtooth'; o.frequency.value = 70;
    l.type = 'sine'; l.frequency.value = 18; lg.gain.value = .05;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .1); g.gain.exponentialRampToValueAtTime(.0001, t + 1.3);
    l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(a.destination);
    o.start(t); l.start(t); o.stop(t + 1.4); l.stop(t + 1.4);
  },
  heartbeat(){
    for(let i = 0; i < 5; i++){
      const d = i * (0.72 - i * 0.07);
      tone(62, .16, 'sine', .4, d, 38);
      tone(52, .2, 'sine', .3, d + .17, 34);
    }
  },
  whoosh(){ tone(1400, 1.2, 'sawtooth', .07, 0, 70); tone(900, 1.2, 'sine', .08, 0, 50); },
  sting(){ tone(220, .5, 'triangle', .12, 0, 110); tone(233, .5, 'triangle', .1, 0, 117); }
};

function avatar(id, size, panic){

  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" class="av" role="img" aria-label="${id}">${BIRD[id]}${sweat}</svg>`;
}
const SP = {
  red:{n:'Red',c:'#f87171'}, chuck:{n:'Chuck',c:'#facc15'}, bomb:{n:'Bomb',c:'#d1d5db'},
  matilda:{n:'Matilda',c:'#f9a8d4'}, pig:{n:'King Pig',c:'#86efac'}, narr:{n:'Narator',c:'#fbbf24'}

/* ===================== EVIDENCE ICONS ===================== */
function icon(t, col){
  const wrap = inner => `<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  switch(t){
    case 'paper': return wrap(`<rect x="5" y="3" width="14" height="18" rx="2" fill="#e7e5e4"/><path d="M8 8h8M8 12h8M8 16h5"/>`);
    case 'feather': return wrap(`<path d="M12 2 L21 20 H3 Z" fill="${col}" fill-opacity=".6"/>`);
    case 'flame': return wrap(`<path d="M12 3 C14 8 18 10 18 15 A6 6 0 0 1 6 15 C6 11 9 10 9 7 C10 8 11 8 12 3Z" fill="${col}" fill-opacity=".6"/>`);
    case 'wax': return wrap(`<path d="M12 3 C16 9 18 12 18 15 A6 6 0 0 1 6 15 C6 12 8 9 12 3Z" fill="${col}" fill-opacity=".6"/><circle cx="10" cy="14" r="1.2" fill="#fff"/>`);
    case 'clock': return wrap(`<circle cx="12" cy="12" r="9" fill="#1e293b"/><path d="M12 7v5l3 2"/>`);
    case 'cup': return wrap(`<path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z" fill="#e7e5e4" fill-opacity=".8"/><path d="M16 10h2a2 2 0 0 1 0 5h-2"/><path d="M8 4v2M12 4v2"/>`);

/* ===================== CASE GENERATOR ===================== */
function generateRandomCase(force, avoid, forceFake){
  const keys = Object.keys(SCN);
  const pool = keys.filter(k => k !== avoid);
  const key = force || pick(pool.length ? pool : keys);
  const scn = SCN[key];
  const fake = key === 'pig' ? (forceFake || pick(SUSPECTS)) : null;
  const culprit = key === 'pig' ? fake : key;
  const misTargets = key === 'red' ? shuffle(SUSPECTS).slice(0, 2) : SUSPECTS.filter(s => s !== culprit);
  const mis = misTargets.map(t => pick(MISDIR[t]));
  const items = [
    { id:scn.crucial, kind:'crucial' },
    { id:mis[0], kind:'mis' },
    { id:mis[1], kind:'mis' },
    { id:scn.ctx, kind:'ctx' }
  ];
  const spots = shuffle(['nest', 'vent', 'fence', 'desk']);
  const placement = {}, kindOf = {};
  items.forEach((it, i) => { placement[spots[i]] = it.id; kindOf[it.id] = it.kind; });
  if(scn.extra){ placement.pocket = scn.extra; kindOf[scn.extra] = 'extra'; } else { placement.pocket = null; }
  return { key, scn, fake, culprit, placement, kindOf };
}
const ptsOf = (it, c) => it.points === '$fake' ? c.fake : it.points;

/* Aturan reaksi tersangka terhadap bukti (murni, tanpa efek samping) */
function respond(X, itemId, c){
  const it = EV[itemId], kind = c.kindOf[itemId], pts = ptsOf(it, c), p = PERS[X];
  if(kind === 'crucial' && pts === X){
    return { text:c.scn.confess(X), delta:100, crack:true, beat:true, log:val(c.scn.logCrack, c) };
  }
  if(pts === 'red'){
    return { text:it.redReact, delta:6, crack:false, beat:kind === 'crucial', red:true,
      log:NAME[X] + ' ditunjukkan "' + it.name + '": heran, lalu menunjuk Red sendiri.' };
  }
  if(pts === X){
    return { text:it.explain, delta:12, crack:false, beat:kind === 'crucial',
      log:NAME[X] + ' ditunjukkan "' + it.name + '": mengakui kaitannya tapi membantah dengan alasan wajar.' };
  }
  const base = X === c.culprit ? p.smug : p.deny;
  const tail = kind === 'crucial' || kind === 'ctx'
    ? ' Kalau melihatnya, ' + NAME[pts] + ' lebih cocok jadi pemiliknya daripada aku.'
    : ' Itu urusan ' + NAME[pts] + ', bukan urusanku.';
  return { text:base + tail, delta:X === c.culprit ? 2 : 3, crack:false, beat:kind === 'crucial',
    log:NAME[X] + ' ditunjukkan "' + it.name + '": menyangkal dan menunjuk ' + NAME[pts] + '.' };
}

function endingKey(choice){
  const c = ui.case;
  if(c.key === 'red') return choice === 'confess' ? 'red_honest' : 'red_tyrant';
  if(choice === c.culprit) return c.key === 'pig' ? 'pig_win' : 'win_' + c.key;
  return 'lose_' + c.key;
}

/* ===================== SELF TEST (mencegah teks undefined) ===================== */
function selfTest(){
  const bad = [], chk = (t, w) => { if(typeof t !== 'string' || /undefined|NaN|\[object|null/.test(t)) bad.push(w + ' => ' + t); };
  Object.keys(SCN).forEach(k => {
    const runs = k === 'pig' ? SUSPECTS : [null];
    runs.forEach(f => {
      const c = generateRandomCase(k, null, f);
      chk(val(c.scn.councilOpen, c), k + ' open'); chk(val(c.scn.truth, c), k + ' truth');
      c.scn.intro.forEach((l, i) => chk(l[1], k + ' intro' + i));
      SUSPECTS.forEach(X => {
        c.scn.alibi[X].forEach((t, i) => chk(t, k + ' alibi ' + X + i));
        chk(pickBy(c.scn.facts, X, c), k + ' fact ' + X); chk(pickBy(c.scn.council, X, c), k + ' council ' + X);
        Object.keys(c.placement).forEach(h => { const id = c.placement[h]; if(!id) return; chk(respond(X, id, c).text, k + ' respond ' + X + id); chk(respond(X, id, c).log, k + ' log ' + X + id); });
      });
      if(k !== 'red') chk(c.scn.confess(c.culprit), k + ' confess');
      ['chuck', 'bomb', 'matilda', 'confess'].forEach(ch => {
        const key = (c.key === 'red') ? (ch === 'confess' ? 'red_honest' : 'red_tyrant') : (ch === c.culprit ? (k === 'pig' ? 'pig_win' : 'win_' + k) : 'lose_' + k);
        if(!ENDINGS[key]) bad.push('ending missing ' + key); else { const e = ENDINGS[key]({ victim:NAME[ch] || 'Red', fake:c.fake }); e.lines.forEach((l, i) => { chk(l[1], key + i); if(!SP[l[0]]) bad.push('speaker ' + l[0]); }); }
      });
    });
  });
  if(Object.keys(EV).length < 10) bad.push('pool kurang dari 10');
  if(bad.length) console.warn('SelfTest masalah:', bad); else console.log('SelfTest OK: ' + Object.keys(EV).length + ' bukti, ' + Object.keys(ENDINGS).length + ' ending.');
}

/* ===================== DIALOG (TYPEWRITER) ===================== */
function say(key, text, opts){
  clearInterval(ui.timer);
  const sp = SP[key];
  ui.opts = opts || {}; ui.full = text; ui.typing = true;
  const sEl = $('#speaker'); sEl.textContent = sp.n; sEl.style.color = sp.c;
  $('#portrait').innerHTML = key === 'narr' ? '<div class="text-3xl text-center">📜</div>' : avatar(key, 60, isPanic(key));
  $('#choices').innerHTML = ''; $('#dtext').textContent = ''; $('#more').classList.add('hidden');
  document.querySelectorAll('[data-av]').forEach(e => e.classList.toggle('speaking', e.dataset.av === key));
  let i = 0;
  ui.timer = setInterval(() => {
    i++; $('#dtext').textContent = text.slice(0, i);
    if(i >= text.length) finishTyping();
  }, 22);
}
const sayS = (X, text, opts) => say(X, mood(X, text), opts);
function finishTyping(){
  if(!ui.typing) return;
  clearInterval(ui.timer); ui.typing = false;
  $('#dtext').textContent = ui.full;
  const o = ui.opts, box = $('#choices'); box.innerHTML = '';
  const mk = (label, fn, disabled, cls) => {
    const b = document.createElement('button'); b.className = cls || 'choice'; b.textContent = label;
    if(disabled) b.disabled = true;
    b.onclick = e => { e.stopPropagation(); fn(); };
    box.appendChild(b);
  };
  if(o.choices) o.choices.forEach(c => mk(c.label, c.fn, c.disabled));
  else if(o.next){ mk('Lanjut ▶', o.next, false, 'choice text-center font-bold'); $('#more').classList.remove('hidden'); }
}
function seq(lines, done){
  let i = 0;
  const step = () => { const l = lines[i++]; say(l[0], l[1], { next: i < lines.length ? step : done }); };
  step();
}
document.addEventListener('click', e => {
  if(e.target.closest('button,[data-hot],#drawer,#scrim')) return;
  if(ui.typing) finishTyping();
  else if(e.target.closest('#dialog') && ui.opts && ui.opts.next && !ui.opts.choices) ui.opts.next();
});

}
function logPanel(){
  const items = ui.log.length ? ui.log.map(l => `<li class="mb-1"><span class="font-bold" style="color:${SP[l.who].c}">${SP[l.who].n}:</span> ${l.text}</li>`).join('') : '<li class="text-slate-400">Tidak ada catatan interogasi.</li>';
  const ev = state.inventory.length ? state.inventory.map(i => i.name).join(', ') : 'Tidak ada';
  return `<div class="rpg p-3 mt-3 text-sm"><h3 class="font-extrabold text-amber-400 mb-1">📋 Log Dewan: Ringkasan Interogasi</h3><ul class="list-none">${items}</ul><p class="mt-2 text-xs text-slate-400"><b>Bukti terkumpul:</b> ${ev}</p></div>`;
}
function suspectCard(id, attr, disabled, extra){
  return `<button class="card ${extra || ''}" ${attr}="${id}" ${disabled ? 'disabled' : ''}>
    <div class="flex justify-center ${shakeCls(id)}">${avatar(id, 84, isPanic(id))}</div>
    <div class="font-extrabold mt-1">${NAME[id]}</div>
    <div class="text-xs text-slate-400 mb-1">Stress ${stressOf(id)}% · ${tierName(stressOf(id))}</div>${barHtml(stressOf(id))}</button>`;
}
function sceneHtml(tokens){
  return tokens.map(t => {
    if(t === 'egg') return `<svg viewBox="0 0 40 50" width="50" height="62"><ellipse cx="20" cy="26" rx="15" ry="20" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><ellipse cx="14" cy="18" rx="4" ry="6" fill="#fff" opacity=".6"/></svg>`;
    if(t === 'tank') return `<svg viewBox="0 0 160 90" width="150" height="85"><rect x="20" y="40" width="110" height="26" rx="6" fill="#64748b" stroke="#0f172a" stroke-width="3"/><rect x="45" y="22" width="55" height="22" rx="5" fill="#475569" stroke="#0f172a" stroke-width="3"/><rect x="95" y="28" width="60" height="7" fill="#334155" stroke="#0f172a" stroke-width="2"/><g fill="#1e293b" stroke="#94a3b8" stroke-width="2"><circle cx="38" cy="72" r="11"/><circle cx="75" cy="72" r="11"/><circle cx="112" cy="72" r="11"/></g></svg>`;
    return avatar(t[0], t[1], !!t[2]);
  }).join('');
}
function renderStage(){
  const st = $('#stage'), p = state.phase, c = ui.case;
  let h = '';
  if(p === 'intro'){
    const n = Object.keys(ui.seen).length;
    h = `<div class="text-center py-4 fade-in">
      <div class="flex justify-center items-end gap-2 sm:gap-6">${avatar('red', 120, false)}${avatar('pig', 100, false)}</div>
      <h1 class="mt-3 text-3xl sm:text-5xl font-extrabold text-red-500 tracking-tight" style="text-shadow:0 3px 0 #7f1d1d">ANGRY BIRDS</h1>
      <h2 class="text-xl sm:text-3xl font-bold text-amber-500">Traitor in the Nest</h2>
      <div class="rpg inline-block mt-4 px-5 py-3 text-left max-w-sm">
        <div class="text-xs uppercase tracking-widest text-amber-500">Berkas Kasus #${ui.caseNo}</div>
        <div class="font-extrabold text-lg">${c.scn.title}</div>
        <div class="text-xs text-slate-400 mt-1">Pelaku, bukti, dan dialog diacak tiap kasus. Ending ditemukan: ${n}/${TOTAL_ENDINGS}</div>
      </div>
      <p class="mt-4 text-[11px] text-slate-500">Karya penggemar non-komersial. Seluruh grafis dibuat dengan SVG inline.</p></div>`;
  } else if(p === 'investigation'){
    h = `<div class="fade-in">${mapSvg()}
      <div class="flex flex-wrap items-center justify-between gap-2 mt-2">
        <p class="text-xs sm:text-sm text-slate-400">Ketuk titik berpendar. Tiap pemeriksaan memakai 1 energi. Ada 5 titik, energimu ${MAX_ENERGY}.</p>
        ${state.inventory.length ? '<button class="btn amber text-sm" data-act="end-invest">Akhiri investigasi ▶</button>' : ''}</div></div>`;
  } else if(p === 'interrogation'){
    if(!ui.current){
      const n = state.interrogated.length;
      h = `<div class="fade-in"><h3 class="font-extrabold text-amber-400 mb-2">Pilih tersangka untuk diinterogasi (${n}/2)</h3>
        <div class="grid grid-cols-3 gap-2 sm:gap-4">${SUSPECTS.map(id => suspectCard(id, 'data-card', n >= 2 && !state.interrogated.includes(id), state.interrogated.includes(id) ? 'picked' : '')).join('')}</div>
        <p class="text-xs text-slate-400 mt-2">Hijau = sudah dipilih. Hanya dua tersangka yang bisa diinterogasi. Stres tinggi belum tentu berarti bersalah.</p>
        ${n >= 2 ? '<div class="text-center mt-4"><button class="btn green" data-act="to-trial">Menuju Sidang Dewan ▶</button></div>' : ''}</div>`;
    } else {
      const id = ui.current, v = stressOf(id);
      h = `<div class="text-center fade-in"><div class="inline-block ${shakeCls(id)}">${avatar(id, 170, isPanic(id))}</div>
        <h3 class="text-xl font-extrabold" style="color:${SP[id].c}">${NAME[id]}</h3>
        <div class="max-w-xs mx-auto mt-1"><div class="text-xs text-slate-400 mb-1">Stress Level: ${v}% · ${tierName(v)}</div>${barHtml(v)}</div>
        ${ui.resolved[id] ? '<div class="mt-2 inline-block text-xs font-bold px-3 py-1 rounded-full bg-red-900 border border-red-500">Alibi runtuh!</div>' : ''}</div>`;
    }
  } else if(p === 'trial'){
    h = `<div class="fade-in">${councilScene()}${logPanel()}</div>`;
  } else if(p === 'judgment'){
    h = `<div class="fade-in">${councilScene()}
      <h3 class="font-extrabold text-red-400 mt-3 mb-2 text-center">Siapa yang akan dilontarkan dari katapel?</h3>
      <div class="grid grid-cols-3 gap-2 sm:gap-4">${SUSPECTS.map(id => suspectCard(id, 'data-pick', false)).join('')}</div>
      ${c.key === 'red' ? '<div class="text-center mt-3"><button class="btn amber" data-act="confess">🕊️ Akui: "Mungkin akulah pelakunya"</button></div>' : ''}
      ${logPanel()}</div>`;
  } else if(p === 'ending'){
    h = endingHtml();
  }
  st.innerHTML = h;
}
function endingHtml(){
  const e = ui.end; if(!e) return '';
  const win = e.tone === 'win';
  const n = Object.keys(ui.seen).length;
  const card = ui.endDone ? `<div class="rpg p-5 text-center mt-3 fade-in">
      <h2 class="text-xl sm:text-3xl font-extrabold ${win ? 'text-emerald-500' : 'text-red-500'}">${e.title}</h2>
      <p class="mt-2 text-slate-300">${e.summary}</p>
      <p class="mt-2 text-sm text-amber-400"><b>Kebenaran kasus:</b> ${val(ui.case.scn.truth, ui.case)}</p>
      <p class="mt-2 text-xs text-slate-400">Ending ditemukan: ${n}/${TOTAL_ENDINGS}</p>
      <button class="btn mt-4" data-act="newcase">🎲 Kasus Baru (Acak Skenario)</button></div>` : '';
  return `<div class="fade-in"><div class="rounded-xl border-2 ${win ? 'border-emerald-600' : 'border-red-700'} p-4 flex justify-center items-end gap-2 flex-wrap" style="background:linear-gradient(#0f172a,${win ? '#064e3b' : '#450a0a'})">${sceneHtml(e.scene)}</div>${card}</div>`;
}

/* ===================== PHASE FLOW ===================== */
function phaseStart(){
  const p = state.phase, c = ui.case;
  if(p === 'intro'){
    const lines = c.scn.intro.concat([['red','Aku hanya punya ' + MAX_ENERGY + ' energi sebelum siang, padahal ada 5 titik yang bisa diperiksa. Pilih dengan bijak.']]);
    seq(lines, () => say('red','Siap memulai penyelidikan?', { choices:[{label:'Mulai Investigasi', fn:() => go('investigation')}] }));
  } else if(p === 'investigation'){
    ui.locked = false;
    say('red','Inilah TKP-nya. Kelima titik ini bisa menyimpan petunjuk. Jangan lupa: tidak semua bukti mengarah ke kebenaran.');
  } else if(p === 'interrogation'){
    ui.current = null; ui.locked = false;
    say('narr','Waktu interogasi. Pilih 2 dari 3 tersangka. Tanyakan alibi, tunjukkan bukti, atau minta kesaksian mereka tentang yang lain.');
  } else if(p === 'trial'){
    trialDialog();
  } else if(p === 'judgment'){
    say('red', c.key === 'red' ? 'Dewan telah bicara. Aku bisa melontarkan salah satu dari mereka... atau menghadapi kebenaran.' : 'Dewan telah mendengar semuanya. Pilih satu burung untuk dilontarkan selamanya dari pulau ini.');
  } else if(p === 'ending'){
    ui.endDone = false;
    const ctx = { victim: NAME[state.accused] || 'Red', fake: c.fake };
    ui.end = ENDINGS[state.endingType](ctx);
    ui.seen[state.endingType] = true;
    try { localStorage.setItem('abtn_seen', JSON.stringify(ui.seen)); } catch(e) { /* penyimpanan tidak tersedia */ }
    renderStage();
    seq(ui.end.lines, () => { ui.endDone = true; renderStage(); say('narr','Tamat. Tekan "Kasus Baru" untuk skenario acak berikutnya.'); });
  }
}
function search(h){
  if(ui.locked) return;
  if(ui.searched[h]){ say('red','Area ini sudah kuperiksa. Jangan buang energi.'); return; }
  if(state.energy <= 0) return;
  const c = ui.case, id = c.placement[h];
  state.energy--; ui.searched[h] = true;
  let text;
  if(id){
    const it = EV[id];
    state.inventory.push({ id, name:it.name, desc:it.desc, iconSvg:icon(it.icon, it.color) });
    sfx.chime(); toast('Bukti baru: ' + it.name);
    text = HS[h].where + ', ' + it.found;
    if(c.key === 'red' && it.thought){ text += ' ' + it.thought; ui.suspicionRed++; setTimeout(() => sfx.sting(), 300); }
  } else {
    text = HS[h].empty;
  }
  renderHUD(); renderInv(); renderStage();
  const cnt = $('#invcount'); cnt.classList.remove('badge-bump'); void cnt.offsetWidth; cnt.classList.add('badge-bump');
  if(state.energy === 0){
    ui.locked = true;
    say('red', text, { next: () => { toast('Hari telah siang, waktu investigasi berakhir!', true); say('narr','Hari telah siang, waktu investigasi berakhir!', { next: () => go('interrogation') }); } });
  } else {
    say('red', text);
  }
}
function addLog(k, who, text){ if(!ui.log.some(l => l.k === k)) ui.log.push({ k, who, text }); }
function enterSuspect(id){
  if(!state.interrogated.includes(id)){
    if(state.interrogated.length >= 2){ say('narr','Hanya dua tersangka yang bisa diinterogasi.'); return; }
    state.interrogated.push(id);
  }
  swap(() => { ui.current = id; renderStage(); sayS(id, PERS[id].intro, { next: () => suspectMenu(id) }); });
}
function suspectMenu(id){
  say('red', 'Apa langkahku selanjutnya terhadap ' + NAME[id] + '?', { choices:[
    { label:'Tanyakan alibi malam kejadian', fn:() => ask(id) },
    { label:'Konfrontasi dengan bukti', fn:() => pickEvidence(id) },
    { label:'Minta kesaksian tentang tersangka lain', fn:() => crossMenu(id) },
    { label:'Selesai interogasi', fn:() => leave() }
  ]});
}
function bump(id, n){ state.stressLevels[id] = Math.max(0, Math.min(100, state.stressLevels[id] + n)); }
function refreshSuspect(){ if(state.phase === 'interrogation') renderStage(); }
function ask(X){
  const c = ui.case, arr = c.scn.alibi[X];
  ui.alibi[X] = (ui.alibi[X] || 0) + 1;
  const n = ui.alibi[X];
  let line = arr[Math.min(n - 1, arr.length - 1)];
  if(c.key === 'pig' && X === c.fake && n >= 2) line += ' Hik... ngik! Eh, maksudku, ehem.';
  if(c.key === 'red') ui.suspicionRed++;
  bump(X, X === c.culprit ? 10 : 6);
  addLog(X + '-alibi', X, NAME[X] + ' beralibi: "' + firstSentence(arr[0]) + '"');
  refreshSuspect();
  sayS(X, line, { next: () => suspectMenu(X) });
}
function crossMenu(W){
  const ch = SUSPECTS.filter(x => x !== W).map(T => ({ label:'Apa yang kau lihat dari ' + NAME[T] + '?', fn:() => cross(W, T) }));
  ch.push({ label:'Batal', fn:() => suspectMenu(W) });
  say('red','Aku ingin kesaksianmu soal tersangka lain, ' + NAME[W] + '.', { choices: ch });
}
function cross(W, T){
  const c = ui.case, f = pickBy(c.scn.facts, T, c);
  addLog(W + '-x-' + T, W, NAME[W] + ' bersaksi tentang ' + NAME[T] + ': "' + firstSentence(f) + '"');
  if(c.key === 'red') ui.suspicionRed++;
  bump(W, 2); refreshSuspect();
  sayS(W, f, { next: () => suspectMenu(W) });
}
function pickEvidence(id){
  if(!state.inventory.length){ say('red','Aku belum punya bukti apa pun.', { next: () => suspectMenu(id) }); return; }
  const ch = state.inventory.map(it => ({ label: it.name, fn: () => confront(id, it.id) }));
  ch.push({ label:'Batal', fn:() => suspectMenu(id) });
  say('red','Bukti mana yang kutunjukkan pada ' + NAME[id] + '?', { choices: ch });
}
function confront(X, evId){
  const c = ui.case, r = respond(X, evId, c);
  if(r.beat) sfx.heartbeat();
  if(r.crack){
    ui.resolved[X] = true; state.stressLevels[X] = 100;
    setTimeout(() => sfx.buzz(), 1200);
  } else {
    bump(X, r.delta);
  }
  if(r.red) ui.suspicionRed++;
  addLog(X + '-ev-' + evId, X, r.log);
  refreshSuspect();
  sayS(X, r.text, { next: () => suspectMenu(X) });
}
function leave(){
  swap(() => {
    ui.current = null; renderStage();
    say('narr', state.interrogated.length >= 2 ? 'Dua tersangka sudah diinterogasi. Saatnya menuju sidang.' : 'Pilih tersangka berikutnya.');
  });
}
function trialDialog(){
  const c = ui.case, s = c.scn;
  const lines = [['red', val(s.councilOpen, c)]];
  SUSPECTS.forEach(X => {
    let t = pickBy(s.council, X, c);
    if(ui.resolved[X]) t = c.key === 'pig' ? 'Hik! Oink... eh, ya, ya, aku ketahuan. Terserah kalian.' : 'Aku sudah mengaku di ruang interogasi. Sekarang keputusan ada di tanganmu, Red.';
    lines.push([X, t]);
  });
  if(c.key === 'red'){
    ui.suspicionRed++;
    lines.push(['narr','Kepala Red berdenging. Potongan ingatan samar muncul: bunker, kunci, tangannya sendiri membawa sesuatu yang berkilau.']);
    lines.push(['red','Kalian... mungkin tidak bersalah. Mungkin akulah yang... Tidak. Aku harus memutuskan.']);
  } else {
    lines.push(['red','Perhatikan Log Dewan. Waktunya memutuskan.']);
  }
  seq(lines, () => go('judgment'));
}
function confirmPick(id){
  say('red', 'Lontarkan ' + NAME[id] + ' dari katapel? Keputusan ini tidak bisa ditarik.', { choices:[
    { label:'Ya, lontarkan ' + NAME[id], fn:() => launch(id) },
    { label:'Tidak, aku masih ragu', fn:() => say('red','Pikirkan baik-baik. Apa yang sebenarnya terjadi malam itu?') }
  ]});
}
function confessPick(){
  say('red','Aku akan mengakui kondisiku di depan seluruh kawanan. Yakin?', { choices:[
    { label:'Ya, aku akan jujur', fn:() => {
        state.accused = 'red'; state.endingType = endingKey('confess'); ui.locked = true;
        say('red','Teman-teman... dengarkan aku. Aku harus mengatakan sesuatu.', { next: () => go('ending') });
      } },
    { label:'Tidak, belum sekarang', fn:() => say('red','Pikirkan baik-baik. Apa yang sebenarnya terjadi malam itu?') }
  ]});
}
function launch(id){
  state.accused = id; ui.locked = true;
  state.endingType = endingKey(id);
  $('#stage').innerHTML = `<div class="relative overflow-hidden rounded-xl border-2 border-slate-700 h-72 sm:h-96">${councilBG()}<div id="proj" class="proj">${avatar(id, 74, true)}</div></div>`;
  say('narr', NAME[id] + ' dimasukkan ke Katapel Raksasa dan tali ditarik...');
  setTimeout(() => { const pj = $('#proj'); if(pj) pj.classList.add('pull'); }, 300);
  setTimeout(() => { sfx.whoosh(); const pj = $('#proj'); if(pj){ pj.classList.remove('pull'); pj.classList.add('fly'); } }, 1400);
  if(state.endingType === 'pig_win'){
    setTimeout(() => { const pj = $('#proj'); if(pj) pj.innerHTML = avatar('pig', 74, false); toast('Kostumnya terlepas di udara!'); sfx.sting(); }, 2300);
  }
  setTimeout(() => go('ending'), 3800);
}
function newCase(){
  clearInterval(ui.timer);
  const last = ui.case ? ui.case.key : null;
  Object.assign(state, fresh());
  Object.assign(ui, { locked:false, searched:{}, current:null, alibi:{}, resolved:{}, log:[], suspicionRed:0, typing:false, opts:{}, endDone:false, end:null });
  ui.case = generateRandomCase(null, last);
  ui.caseNo++;
  state.scenario = ui.case.key;
  renderInv();
  go('intro');
}

/* ===================== EVENTS ===================== */
$('#stage').addEventListener('click', e => {
  const hot = e.target.closest('[data-hot]');
  if(hot){ search(hot.dataset.hot); return; }
  const card = e.target.closest('[data-card]');
  if(card && !card.disabled){ enterSuspect(card.dataset.card); return; }
  const pickEl = e.target.closest('[data-pick]');
  if(pickEl && !ui.locked){ confirmPick(pickEl.dataset.pick); return; }
  const act = e.target.closest('[data-act]');
  if(!act || ui.locked && act.dataset.act !== 'newcase') return;
  const a = act.dataset.act;
  if(a === 'end-invest'){ ui.locked = true; say('narr','Kau menghentikan investigasi lebih awal.', { next: () => go('interrogation') }); }
  else if(a === 'to-trial') go('trial');
  else if(a === 'confess') confessPick();
  else if(a === 'newcase') newCase();
});
$('#stage').addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-hot]')){ e.preventDefault(); search(e.target.closest('[data-hot]').dataset.hot); }
});
const toggleDrawer = open => { $('#drawer').classList.toggle('open', open); $('#scrim').classList.toggle('open', open); };
$('#invbtn').addEventListener('click', () => toggleDrawer(true));
$('#invclose').addEventListener('click', () => toggleDrawer(false));
$('#scrim').addEventListener('click', () => toggleDrawer(false));
$('#mute').addEventListener('click', () => { ui.muted = !ui.muted; $('#mute').textContent = ui.muted ? '🔇' : '🔊'; });

/* ===================== INIT ===================== */
selfTest();
ui.case = generateRandomCase();
state.scenario = ui.case.key;
renderHUD(); renderInv(); renderStage(); phaseStart();
</script>
</body>
</html>
